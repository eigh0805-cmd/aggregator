name: Aggregator-6h

# Every 6 hours (UTC) + manual dispatch.
# No-token design: collect.py is run WITHOUT Gist credentials, so it skips the
# Gist push (see subscribe/collect.py: "if gist_id and access_token") and leaves
# data/clash.yaml, data/v2ray.txt, data/singbox.json in the workspace.
# The last step commits those files back to this repo with the built-in
# GITHUB_TOKEN. If the collect step fails, the job stops and the previously
# committed subscriptions stay untouched.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: aggregator-6h
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  # Force empty: guarantees collect.py never tries to push to a Gist.
  GIST_PAT: ""
  GIST_LINK: ""

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Collect
        # No --skip: proxies are liveness-checked before being written out.
        run: python -u subscribe/collect.py --all --overwrite

      - name: Verify outputs
        run: |
          ls -lh data/
          test -s data/clash.yaml
          test -s data/v2ray.txt
          test -s data/singbox.json
          grep -q "proxies:" data/clash.yaml
          python3 -c "import json; d=json.load(open('data/singbox.json')); assert 'outbounds' in d, 'no outbounds'; print('singbox ok, outbounds:', len(d['outbounds']))"

      - name: Commit subscriptions back to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No subscription changes to commit."
          else
            git commit -m "chore: update subscriptions $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Summary
        if: success()
        run: |
          {
            echo "## Subscriptions updated"
            echo ""
            echo "- Clash: https://raw.githubusercontent.com/${{ github.repository }}/main/data/clash.yaml"
            echo "- V2Ray: https://raw.githubusercontent.com/${{ github.repository }}/main/data/v2ray.txt"
            echo "- Sing-box: https://raw.githubusercontent.com/${{ github.repository }}/main/data/singbox.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Timestamp
        run: date
